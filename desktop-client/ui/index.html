<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SyMoNeuRaL Desktop</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<header class="top">
  <h1>SyMoNeuRaL</h1>
  <!-- Not a decorative indicator. `.dot` carries no colour of its own until a real
       /api/status read sets one, and the text beside it says which reading it came from.
       An LED that is green before anything has been read is the one dishonest pixel on a
       page arguing for measurement. -->
  <div class="conn">
    <span id="dot" class="dot" data-state="unread"></span>
    <span id="conn-text">not yet read</span>
    <button id="refresh" type="button">Read /api/status</button>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-panel="chat"  aria-selected="true" >Chat</button>
  <button role="tab" data-panel="image" aria-selected="false">Image</button>
  <button role="tab" data-panel="calc"  aria-selected="false">RavenCalc</button>
</nav>

<main>

  <section id="panel-chat" class="panel" data-open="1">
    <div id="transcript" class="transcript" aria-live="polite"></div>
    <form id="chat-form" class="composer">
      <textarea id="chat-prompt" rows="3" placeholder="Ask SyMoNeuRaL Chat"></textarea>
      <div class="row">
        <label>temperature <input id="chat-temp" type="number" value="0.7" min="0" max="5" step="0.1"></label>
        <label>max tokens <input id="chat-max" type="number" value="512" min="1" max="32768" step="1"></label>
        <button id="chat-send" type="submit">Send</button>
      </div>
    </form>
  </section>

  <section id="panel-image" class="panel">
    <form id="image-form" class="composer">
      <textarea id="image-prompt" rows="3" placeholder="Describe the image"></textarea>
      <div class="row">
        <label>steps <input id="image-steps" type="number" value="4" min="1" max="100" step="1"></label>
        <label>size <input id="image-size" type="number" value="768" min="64" max="2048" step="64"></label>
        <label>seed <input id="image-seed" type="number" min="0" placeholder="random"></label>
        <button id="image-send" type="submit">Render</button>
      </div>
    </form>
    <div id="image-out" class="out"></div>
  </section>

  <section id="panel-calc" class="panel">
    <form id="calc-form" class="composer">
      <div class="row">
        <label class="grow">expression <input id="calc-expr" type="text" value="x**2*sin(x)"></label>
      </div>
      <div class="row">
        <label>operation
          <select id="calc-op">
            <option>simplify</option>
            <option>differentiate</option>
            <option>integrate</option>
            <option>limit</option>
            <option>series</option>
            <option>solve</option>
            <option>evaluate</option>
          </select>
        </label>
        <label>variable <input id="calc-var" type="text" value="x" size="4"></label>
        <label>point <input id="calc-point" type="text" placeholder="limit / series only" size="12"></label>
        <button id="calc-send" type="submit">Compute</button>
      </div>
    </form>
    <div id="calc-out" class="out"></div>
  </section>

</main>

<script src="app.js"></script>
</body>
</html>
