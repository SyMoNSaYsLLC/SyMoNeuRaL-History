# meta-symoneural-quail -- Android and Fire OS, via the Swift SDK for Android and the NDK
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "symoneural-quail"
# Empty on purpose, and the honest inventory of this layer today: no recipes and no
# machine conf. What exists is this file, README.md and conf/include/android-notes.inc,
# which records why there is deliberately no symoneural-android machine (Android is
# bionic; an OE toolchain emits glibc/musl, an ABI fact and not a missing recipe) and
# which toolchains actually reach Android -- the Swift SDK for Android and the NDK,
# both outside bitbake. The old "^${LAYERDIR}/" pattern promised recipes that do not
# exist, and bitbake warned "No bb files in default matched
# BBFILE_PATTERN_symoneural-quail" on every parse. An empty pattern is bitbake's
# spelling for a layer that deliberately has no recipes (cooker.py compiles it to
# ^NULL$), and the IGNORE_EMPTY line is what suppresses the warning for it. When the
# first recipe lands -- android-notes.inc names the work this layer is for: the
# aarch64 Linux appliance an Android client talks to -- restore
# BBFILE_PATTERN_symoneural-quail = "^${LAYERDIR}/", or the file will belong to no
# collection.
BBFILE_PATTERN_symoneural-quail = ""
BBFILE_PATTERN_IGNORE_EMPTY_symoneural-quail = "1"
BBFILE_PRIORITY_symoneural-quail = "22"

# Both series are named because openembedded-core on the reference box reports
# LAYERSERIES_COMPAT_core = "blacksail" while meta-openembedded's meta-oe still declares
# "whinlatter wrynose". A layer that names only one of them fails to parse against the
# other, and the failure reads as a broken layer rather than a series mismatch.
LAYERSERIES_COMPAT_symoneural-quail = "blacksail wrynose whinlatter"

LAYERDEPENDS_symoneural-quail = "core symoneural-core"
