# ops/Containerfile runs the stack in a container, so the target kernel needs the
# namespaces and cgroup controllers that requires. Without CGROUP_DEVICE in particular the
# container starts and then cannot be granted the GPU device node, which presents as a
# CUDA initialisation failure rather than as a missing kernel option.
CONFIG_NAMESPACES=y
CONFIG_USER_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_MEMCG=y
CONFIG_CPUSETS=y
CONFIG_OVERLAY_FS=y
CONFIG_BRIDGE=y
CONFIG_VETH=y
