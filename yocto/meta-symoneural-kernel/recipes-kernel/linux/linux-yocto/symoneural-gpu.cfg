# What the GPU path needs from the kernel.
#
# The proprietary NVIDIA driver is an out-of-tree module and is NOT enabled here -- it
# cannot be, it is not in the kernel source. These are the in-tree prerequisites it and
# the governor need, and each one has a failure that names it:
#
#   no CONFIG_MTRR / PAT      the driver loads and every mapping is uncached; throughput
#                             collapses without an error
#   no IOMMU                  vfio passthrough is unavailable, so the container path in
#                             ops/Containerfile cannot see the card
#   no HUGETLBFS              large allocations fall back to 4K pages; measurable, and the
#                             PCIe Gen 3 x8 ceiling already documented gets worse
CONFIG_MTRR=y
CONFIG_X86_PAT=y
CONFIG_AGP=n
CONFIG_DRM=y
CONFIG_DRM_NOUVEAU=n
CONFIG_HUGETLBFS=y
CONFIG_HUGETLB_PAGE=y
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_IOMMU_SUPPORT=y
CONFIG_INTEL_IOMMU=y
CONFIG_AMD_IOMMU=y
CONFIG_VFIO=m
CONFIG_VFIO_PCI=m
CONFIG_PCI_MSI=y
# The governor reads per-process VRAM out of nvidia-smi, but the 1.5 GB drain floor is
# only observable if the driver can report it; DEVICE_PRIVATE backs that accounting.
CONFIG_DEVICE_PRIVATE=y
# usbmuxd needs this or it starts, logs nothing, and never sees an attached iPhone.
CONFIG_USB_SUPPORT=y
CONFIG_USB_XHCI_HCD=y
