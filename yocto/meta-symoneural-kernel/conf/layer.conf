# meta-symoneural-kernel -- kernel configuration for the reference workstation
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "symoneural-kernel"
BBFILE_PATTERN_symoneural-kernel = "^${LAYERDIR}/"
BBFILE_PRIORITY_symoneural-kernel = "11"

# Both series are named because openembedded-core on the reference box reports
# LAYERSERIES_COMPAT_core = "blacksail" while meta-openembedded's meta-oe still declares
# "whinlatter wrynose". A layer that names only one of them fails to parse against the
# other, and the failure reads as a broken layer rather than a series mismatch.
LAYERSERIES_COMPAT_symoneural-kernel = "blacksail wrynose whinlatter"

LAYERDEPENDS_symoneural-kernel = "core symoneural-core"
