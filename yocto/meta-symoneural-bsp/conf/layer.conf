# meta-symoneural-bsp -- machine definitions
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "symoneural-bsp"
# Empty on purpose: this is a machine-conf layer. It ships conf/machine/*.conf and no
# recipes, so the old "^${LAYERDIR}/" pattern matched no .bb file and bitbake warned
# "No bb files in default matched BBFILE_PATTERN_symoneural-bsp" on every parse. An
# empty pattern is bitbake's spelling for a layer that deliberately has no recipes
# (cooker.py compiles it to ^NULL$), and the IGNORE_EMPTY line is what suppresses the
# warning for it. If a recipe ever lands here, restore
# BBFILE_PATTERN_symoneural-bsp = "^${LAYERDIR}/": BBFILES above already collects the
# file, but without the pattern it belongs to no collection.
BBFILE_PATTERN_symoneural-bsp = ""
BBFILE_PATTERN_IGNORE_EMPTY_symoneural-bsp = "1"
BBFILE_PRIORITY_symoneural-bsp = "17"

# Both series are named because openembedded-core on the reference box reports
# LAYERSERIES_COMPAT_core = "blacksail" while meta-openembedded's meta-oe still declares
# "whinlatter wrynose". A layer that names only one of them fails to parse against the
# other, and the failure reads as a broken layer rather than a series mismatch.
LAYERSERIES_COMPAT_symoneural-bsp = "blacksail wrynose whinlatter"

LAYERDEPENDS_symoneural-bsp = "core"
