#@TYPE: Machine
#@NAME: symoneural-workstation
#@DESCRIPTION: The reference box -- x86-64, one RTX 5070 Ti (Blackwell, sm_120), 15.92 GiB
#              of VRAM on a PCIe Gen 3 x8 link.
#
# The Gen 3 x8 figure is measured on this machine and is on the public site as a negative
# result. It is recorded here because it is a property of the machine, not of the software,
# and anything sizing a transfer against Gen 4 x16 will be wrong by a factor of four.

require conf/machine/include/x86/tune-corei7.inc

MACHINE_FEATURES = "efi pcbios usbhost pci rtc alsa"

# The kernel provider is named but NOT YET RESOLVABLE, and the line stays anyway. Measured
# with `bitbake -g symoneural-image`: ERROR: Nothing PROVIDES 'virtual/kernel', naming five
# providers skipped as "not in COMPATIBLE_MACHINE". Those five come from four recipes, each
# carrying a closed regex of qemu machines -- linux-yocto_6.18.bb:55, linux-yocto-rt_6.18.bb:38,
# linux-yocto-tiny_6.18.bb:29, linux-yocto-dev.bb:48 -- the fifth being linux-yocto-upstream,
# which is linux-yocto_6.18.bb again under BBCLASSEXTEND (:37, :39) and so shares :55. A regex
# anchored ^...$ over a fixed list cannot be widened by a bbappend: meta-symoneural-kernel's
# linux-yocto_%.bbappend does match, and `bitbake-layers show-appends` still prints its base
# as "linux-yocto_6.18.bb (skipped)".
#
# The two wrong fixes, named here so nobody reaches for them:
#   * Deleting this line lets linux-dummy win: linux-dummy.bb:10 PROVIDES virtual/kernel and
#     :18 adds kernel-modules, so BOTH graph errors disappear and the image does not boot.
#   * A COMPATIBLE_MACHINE:symoneural-workstation override in the bbappend needs a KMACHINE
#     and a KBRANCH, and only yocto-kernel-cache can say whether either value is real. That
#     repo is not on this box, so any value written here would be a guess that parses.
#
# The supported path is meta-skeleton/recipes-kernel/linux/linux-yocto-custom.bb:7-15: copy
# it into meta-symoneural-kernel and give it a kernel tree, a SRCREV and a defconfig. Which
# tree and which revision is Garrett's call, queued in GARRETT-INBOX.md. Until it is made,
# this line is what keeps the failure loud instead of silently shipping a dummy kernel.
#
# A PREFERRED_VERSION_linux-yocto pin lived here and named "6.12%". linux-yocto_6.18.bb is
# the only linux-yocto recipe on the box, so the pin selected nothing; it is gone rather
# than corrected, because a version pin on a recipe this machine can never use is noise.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"

KERNEL_IMAGETYPE = "bzImage"
SERIAL_CONSOLES = "115200;ttyS0"

IMAGE_FSTYPES ?= "wic wic.bmap"
WKS_FILE ?= "symoneural.wks"

EXTRA_IMAGEDEPENDS += "grub-efi"

# The out-of-tree NVIDIA module is not referenced by any recipe in this layer. There is no
# nvidia-driver recipe in the layers on this box, and naming one would produce "Nothing
# PROVIDES" -- an error that reads as a broken machine config rather than as a driver that
# has to be installed on the target from NVIDIA's own package.
MACHINEOVERRIDES =. "symoneural:"
