#@TYPE: Machine
#@NAME: symoneural-arm64
#@DESCRIPTION: Generic aarch64 target -- AWS Graviton, an SBC, or a CPU-only appliance.
#
# No GPU. That is the defining property, not an omission: on this machine chat, image and
# training are all unavailable, and `symoneural-cli status` says so. RavenCalc is the one
# surface that runs at full capability here, because it is SymPy on the CPU and
# deliberately never takes the lock.

require conf/machine/include/arm/arch-armv8-2a.inc

MACHINE_FEATURES = "efi usbhost pci rtc"
# Unresolvable for the same reason as symoneural-workstation.conf, and left in place for the
# same reason. See the comment above the identical line there: the qemu-only COMPATIBLE_MACHINE
# regexes, the two wrong fixes, and why linux-yocto-custom.bb is the path. Do not delete this
# line to make `bitbake -g` go green -- that is linux-dummy, and it does not boot.
PREFERRED_PROVIDER_virtual/kernel ?= "linux-yocto"
KERNEL_IMAGETYPE = "Image"
SERIAL_CONSOLES = "115200;ttyAMA0"
IMAGE_FSTYPES ?= "wic wic.bmap"
WKS_FILE ?= "symoneural.wks"
EXTRA_IMAGEDEPENDS += "grub-efi"
MACHINEOVERRIDES =. "symoneural:"
