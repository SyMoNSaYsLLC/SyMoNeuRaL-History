# The SyMoNeuRaL distribution.
#
# A distro rather than a set of image recipes because the decisions below are policy for
# every image we build, not per-image taste: systemd, no X, wayland only if asked, and a
# package format that matches how the stack is already shipped to this host (.deb, so a
# Yocto-built target and an apt-installed workstation are managed the same way).

DISTRO = "symoneural"
DISTRO_NAME = "SyMoNeuRaL"
# Tracks the .deb's upstream version. Kept in step by hand: two version numbers that
# drift apart are worse than one, so if you bump the package, bump this.
DISTRO_VERSION = "0.1.0"
DISTRO_CODENAME = "raven"
SDK_VENDOR = "-symoneuralsdk"
SDK_VERSION = "${@d.getVar('DISTRO_VERSION').replace('snapshot-${METADATA_REVISION}', 'snapshot')}"

MAINTAINER = "Garrett McDonald <gmcdonald@symoneural.com>"
TARGET_VENDOR = "-symoneural"

LOCALCONF_VERSION = "2"
LAYER_CONF_VERSION ?= "7"

# systemd, not sysvinit. The stack's own units (symoneural-api, caddy) are systemd units
# already, and `symoneural-cli upgrade` calls `systemctl restart symoneural-api`. Building
# a sysvinit target would mean maintaining a second init story for no gain.
INIT_MANAGER = "systemd"

# .deb to match how this stack is installed on the reference workstation. That is not
# cosmetic: scripts/build-apt-repo.sh publishes a flat apt repository, and a Yocto target
# built with ipk could not consume it.
PACKAGE_CLASSES ?= "package_deb"

DISTRO_FEATURES:append = " systemd usbhost usbgadget pam opengl vulkan"
DISTRO_FEATURES:remove = "sysvinit"
# x11 is deliberately absent. The serving surface is HTTP; the only local display need is a
# console. Adding x11 pulls in a display stack that has to be kept patched and answers no
# request the site makes.

VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_dev_manager = "systemd"

# Where the recipes read our source from. There is no git remote for this project by
# design -- history has never left the reference box -- so the fetcher is pointed at a
# local path over the file protocol. Override it on any other host, or set
# SYMONEURAL_GIT_URI to a real remote once one exists.
SYMONEURAL_GIT ?= "/home/google/Symoneural"
SYMONEURAL_GIT_URI ?= "git://${SYMONEURAL_GIT};protocol=file;branch=main"

# A single place to say which revision every first-party recipe builds. Recipes default to
# AUTOREV so a plain build tracks the working branch; pin this to a SHA for a release, which
# is the only way two builds of "0.1.0" mean the same thing.
SYMONEURAL_SRCREV ?= "${AUTOREV}"

# no-static-libs.inc, security_flags.inc and yocto-uninative.inc are NOT required here.
# openembedded-core requires all three from conf/distro/defaultsetup.conf:8, :9 and :13,
# and defaultsetup.conf is not something a distro opts into -- meta/conf/bitbake.conf:833
# includes it unconditionally on every build. Requiring them again is not harmless: it emits
# three "Duplicate inclusion" warnings on every single parse, which is how a real warning
# gets lost in the noise. Measured with `bitbake -p`: 6 WARNING messages with these
# three lines present, 3 without them. The warning blames defaultsetup.conf as the
# duplicate includer, which also tells you the distro conf is parsed first.
