[build-system]
requires = ["setuptools>=77"]   # SPDX string form of project.license landed in 77
build-backend = "setuptools.build_meta"

[project]
name = "oematch"
version = "0.1.0"
description = "Fingerprint a software artifact and match it to OpenEmbedded/Yocto layers and recipes"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "SymonSays LLC"}]
dependencies = []

[project.scripts]
oematch = "oematch.cli:main"

[tool.setuptools.packages.find]
include = ["oematch*"]
