[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oematch"
version = "0.1.0"
description = "Fingerprint a software artifact and match it to OpenEmbedded/Yocto layers and recipes"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SymonSays LLC"}]
dependencies = []

[project.scripts]
oematch = "oematch.cli:main"

[tool.setuptools.packages.find]
include = ["oematch*"]
