# systemd-tmpfiles. Recreates the runtime tree on every boot, because /run is a tmpfs and
# the GPU lock directory has to exist before the first surface asks for the card.
d /run/symoneural 0755 root root -
d /run/symoneural/gpu.lock.d 0755 root root -
d /var/lib/symoneural 0755 root root -
d /var/lib/symoneural/output 0755 root root -
d /var/lib/symoneural/models 0755 root root -
z /etc/symoneural 0700 root root -
# api.env is listed with z rather than f: f would truncate an existing secrets file on
# every boot, which is a data-loss bug wearing the costume of a permissions fix.
z /etc/symoneural/api.env 0600 root root -
