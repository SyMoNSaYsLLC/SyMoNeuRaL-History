# Two isolated sessions over one shared bus -- what `isolate` is for.
#
# `bus` is mounted once, at the top, and both sessions see it: they were not asked to fork it.
# `llm` and `memory` are forked per session, so `session-a.llm` and `session-b.llm` are two
# different objects under one name, and neither session can reach the other's.
#
# `intercept` on session-b declares a default for anything under it that *injects* `llm`: the
# consumer gets a proxy that merges `temperature: 0.0` into every call, and it neither asked for
# that nor can see it, because the config lives on the group rather than in the plugin.
#
# Read this one as syntax, not as a working demonstration: nothing under `session-b` injects
# `llm`. `echo_llm` provides it, and no example plugin in `plugins/` consumes it, so the override
# is declared here and inert here. What it does once a consumer exists is
# `test_exp.py::InterceptTests`, and the proxy itself is `_Intercepted` in `context.py`.
plugins:
  - id: bus
    use: apps.symoneuralexp.plugins.bus

  - id: session-a
    isolate: [llm, memory]
    plugins:
      - {id: a.llm,    use: apps.symoneuralexp.plugins.echo_llm, config: {prefix: "a> "}}
      - {id: a.memory, use: apps.symoneuralexp.plugins.memory}

  - id: session-b
    isolate: [llm, memory]
    intercept:
      llm: {temperature: 0.0}
    plugins:
      - {id: b.llm,    use: apps.symoneuralexp.plugins.echo_llm, config: {prefix: "b> "}}
      - {id: b.memory, use: apps.symoneuralexp.plugins.memory}
