<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1040" viewBox="0 0 1680 1040" role="img" aria-labelledby="title desc">
  <title id="title">SyMoNeuRaL Phase 0.5 — Means of Re-measure</title>
  <desc id="desc">Accepted means for Phase 0.5 full-suite re-measure: run the capture block, paste the 0.5 tail, classify HEAD, backend pytest, collect-only, remix pytest, timings, and residue.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 18; }
      .greenPanel { fill: #112418; stroke: #3fb950; stroke-width: 3; rx: 18; }
      .amberPanel { fill: #2b2111; stroke: #d29922; stroke-width: 3; rx: 18; }
      .redPanel { fill: #261b1b; stroke: #f85149; stroke-width: 2; rx: 18; }
      .bluePanel { fill: #101d2b; stroke: #58a6ff; stroke-width: 2; rx: 18; }
      .title { fill: #f0f6fc; font: 700 36px system-ui, -apple-system, Segoe UI, sans-serif; }
      .subtitle { fill: #8b949e; font: 500 18px system-ui, -apple-system, Segoe UI, sans-serif; }
      .heading { fill: #f0f6fc; font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; }
      .body { fill: #c9d1d9; font: 500 17px system-ui, -apple-system, Segoe UI, sans-serif; }
      .muted { fill: #8b949e; font: 500 15px system-ui, -apple-system, Segoe UI, sans-serif; }
      .green { fill: #3fb950; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .yellow { fill: #d29922; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .red { fill: #f85149; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .blue { fill: #58a6ff; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { fill: #c9d1d9; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .monoSmall { fill: #c9d1d9; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { stroke: #30363d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b949e; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .pillGreen { fill: #14301d; stroke: #3fb950; stroke-width: 1; rx: 12; }
      .pillAmber { fill: #332a16; stroke: #d29922; stroke-width: 1; rx: 12; }
      .pillBlue { fill: #10243a; stroke: #58a6ff; stroke-width: 1; rx: 12; }
      .pillRed { fill: #351b1b; stroke: #f85149; stroke-width: 1; rx: 12; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#30363d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1040"/>

  <text class="title" x="60" y="68">SyMoNeuRaL Phase 0.5 — Means</text>
  <text class="subtitle" x="60" y="100">Snapshot: 2026-08-22 09:54 EDT · accepted full-suite re-measure command and handoff</text>

  <rect class="greenPanel" x="60" y="130" width="1560" height="135"/>
  <text class="heading" x="90" y="172">Starting state</text>
  <text class="body" x="90" y="206">Phase 0.5 starts after Gateway verification, A/B/C commits, and Commit A message repair are green.</text>
  <text class="mono" x="90" y="236">Expected repaired HEAD: 242a688d · run from /home/google/Symoneural · backend pytest from backend/</text>
  <rect class="pillGreen" x="1375" y="156" width="185" height="38"/>
  <text class="green" x="1404" y="181">READY FOR 0.5</text>

  <rect class="amberPanel" x="60" y="300" width="1560" height="150"/>
  <text class="heading" x="90" y="342">Current action</text>
  <text class="body" x="90" y="376">Run the capture block once. Quiet during the apps suite is normal; expected runtime is roughly minutes, not seconds.</text>
  <text class="mono" x="90" y="410">LOG=/tmp/phase0-5-remeasure.log · paste marker: THE 0.5 TAIL — paste from here down</text>
  <rect class="pillAmber" x="1330" y="327" width="230" height="38"/>
  <text class="yellow" x="1355" y="352">PENDING TAIL</text>

  <path class="line" d="M840 450 L840 490"/>

  <rect class="bluePanel" x="60" y="490" width="500" height="250"/>
  <text class="heading" x="90" y="530">Command invariants</text>
  <text class="blue" x="90" y="563">DO NOT CHANGE THESE</text>
  <text class="monoSmall" x="90" y="596">set +H</text>
  <text class="monoSmall" x="90" y="620">set -euo pipefail</text>
  <text class="monoSmall" x="90" y="644">cd backend before pytest apps/</text>
  <text class="monoSmall" x="90" y="668">--ignore reinforce plugin tests</text>
  <text class="monoSmall" x="90" y="692">--ignore backend apps/remix tests</text>
  <text class="monoSmall" x="90" y="716">run apps/remix separately</text>

  <rect class="bluePanel" x="590" y="490" width="500" height="250"/>
  <text class="heading" x="620" y="530">Tail classification</text>
  <text class="blue" x="620" y="563">GREEN ONLY IF PRESENT</text>
  <text class="monoSmall" x="620" y="596">HEAD = 242a688d</text>
  <text class="monoSmall" x="620" y="620">backend apps passed, 0 failed</text>
  <text class="monoSmall" x="620" y="644">collect-only total printed</text>
  <text class="monoSmall" x="620" y="668">remix passed, expected near 28</text>
  <text class="monoSmall" x="620" y="692">both real timings printed</text>
  <text class="monoSmall" x="620" y="716">status residue unchanged</text>

  <rect class="panel" x="1120" y="490" width="500" height="250"/>
  <text class="heading" x="1150" y="530">Handoff options</text>
  <text class="body" x="1150" y="563">Preferred: paste everything under the tail marker.</text>
  <text class="monoSmall" x="1150" y="596">THE 0.5 TAIL — paste from here down</text>
  <text class="body" x="1150" y="632">Alternates:</text>
  <text class="monoSmall" x="1150" y="666">upload /tmp/phase0-5-remeasure.log</text>
  <text class="monoSmall" x="1150" y="690">cp log into /home/google/Symoneural/run/</text>

  <path class="dash" d="M840 740 L840 780"/>

  <rect class="greenPanel" x="60" y="780" width="760" height="115"/>
  <text class="heading" x="90" y="822">Green path</text>
  <text class="body" x="90" y="856">Write the CLAUDE.md ladder entry with SHA, counts, collect-only total, remix count, and timings.</text>
  <text class="muted" x="90" y="884">Then advance to Phase 0.6 hygiene.</text>

  <rect class="redPanel" x="860" y="780" width="760" height="115"/>
  <text class="heading" x="890" y="822">Red path</text>
  <text class="body" x="890" y="856">Do not write the ladder entry. Do not start hygiene. Fix only the re-measure command/suite issue.</text>
  <text class="muted" x="890" y="884">Paste full log if tail lacks a classification key.</text>

  <rect class="redPanel" x="60" y="925" width="1560" height="52"/>
  <text class="red" x="90" y="958">HARD HOLD:</text>
  <text class="body" x="205" y="958">no deploy · no Phase 1 · no docs/specs commit · no zip movement · no safety-branch deletion until 0.5 green and 0.6 begins</text>
</svg>
