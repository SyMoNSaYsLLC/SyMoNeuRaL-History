<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1080" viewBox="0 0 1720 1080" role="img" aria-labelledby="title desc">
  <title id="title">SyMoNeuRaL Phase 0 — Commit A Message Repair Approved</title>
  <desc id="desc">Commit A message repair is approved before Phase 0.5. Safety branch and dirty-tree precheck are required. If rebase stops, abort and return to main. The safety branch is deleted at 0.6 hygiene, not before.</desc>
  <defs>
