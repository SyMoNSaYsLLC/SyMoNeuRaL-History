  <text class="monoSmall" x="90" y="636">?? backend/SMOKE-livestack-image.md</text>
  <text class="monoSmall" x="90" y="660">?? docs/specs/*</text>
  <text class="monoSmall" x="90" y="684">?? symoneural.zip</text>
  <text class="monoSmall" x="90" y="708">?? symoneuralv2.zip</text>

