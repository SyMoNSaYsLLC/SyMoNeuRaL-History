  <rect class="bg" x="0" y="0" width="1720" height="1080"/>

  <text class="title" x="60" y="68">SyMoNeuRaL Phase 0 — Repair Approved</text>
  <text class="subtitle" x="60" y="100">Snapshot: 2026-08-22 09:41 EDT · Commit A message repair approved before Phase 0.5</text>

  <rect class="greenPanel" x="60" y="130" width="1600" height="140"/>
  <text class="heading" x="90" y="172">Prior gates closed</text>
  <text class="body" x="90" y="206">Gateway fold verification passed. A/B/C commit-output gate passed. Scope gate sections were replaced with a closed record.</text>
  <text class="mono" x="90" y="238">A b5731054 · B 5a29352f · C f29a1f68 · residue unchanged</text>
  <rect class="pillGreen" x="1410" y="157" width="190" height="38"/>
  <text class="green" x="1435" y="182">GREEN SO FAR</text>

  <rect class="amberPanel" x="60" y="305" width="1600" height="150"/>
  <text class="heading" x="90" y="347">Approved decision: repair Commit A message now</text>
  <text class="body" x="90" y="382">Reason: git log is load-bearing; no remote or external SHA reference exists yet; Phase 0.5 should stamp final rewritten SHAs.</text>
  <text class="mono" x="90" y="416">Required: set +H · dirty-tree precheck · safety branch · amend A with -F · rebase B/C onto repaired A</text>
  <rect class="pillAmber" x="1368" y="332" width="230" height="38"/>
  <text class="yellow" x="1394" y="357">PENDING REPAIR OUTPUT</text>

