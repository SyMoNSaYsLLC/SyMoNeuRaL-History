  <text class="heading" x="640" y="535">Guard 2 — Safety branch</text>
  <text class="blue" x="640" y="568">KEEP OLD SHAS ALIVE</text>
  <text class="monoSmall" x="640" y="602">git branch phase0-before-message-repair main</text>
  <text class="body" x="640" y="636">This branch preserves the original A/B/C chain.</text>
  <text class="body" x="640" y="670">Do not delete it after repair.</text>
  <text class="muted" x="640" y="704">Delete only during Phase 0.6 hygiene.</text>

