  <text class="heading" x="1190" y="535">Red path — Rebase stops</text>
  <text class="red" x="1190" y="568">STOP. DO NOT CONTINUE TO 0.5.</text>
  <text class="monoSmall" x="1190" y="602">git rebase --abort</text>
  <text class="monoSmall" x="1190" y="626">git checkout main</text>
  <text class="body" x="1190" y="660">Return to current tree exactly.</text>
  <text class="muted" x="1190" y="694">Most likely cause: timer touched PROJECT-TASKS.md.</text>

  <path class="dash" d="M860 745 L860 790"/>

  <rect class="greenPanel" x="60" y="790" width="1600" height="125"/>
  <text class="heading" x="90" y="832">Next after repair output: Phase 0.5 full-suite re-measure</text>
  <text class="body" x="90" y="866">Run 0.5 only after the repair output shows rewritten A/B/C order and restored Commit A message tail.</text>
  <text class="mono" x="90" y="898">Paste repair output first · then paste /tmp/remeasure.log tail with the final HEAD SHA</text>

  <rect class="panel" x="60" y="940" width="1600" height="52"/>
  <text class="yellow" x="90" y="973">0.6 HYGIENE LATER:</text>
  <text class="body" x="235" y="973">delete phase0-before-message-repair only after repaired SHAs stamp 0.5 and hygiene begins</text>

  <rect class="redPanel" x="60" y="1010" width="1600" height="42"/>
  <text class="red" x="90" y="1037">HOLDING:</text>
  <text class="body" x="180" y="1037">no deploy · no Phase 1 · no docs/specs commit · no zips · no safety-branch deletion until 0.6</text>
