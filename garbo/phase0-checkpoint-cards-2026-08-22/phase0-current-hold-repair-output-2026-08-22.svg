<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1000" viewBox="0 0 1680 1000" role="img" aria-labelledby="title desc">
  <title id="title">SyMoNeuRaL Phase 0 — Repair Output Hold</title>
  <desc id="desc">Current hold waits for Block 1 repair output, then Phase 0.5 re-measure tail. No deploy, Phase 1, docs/specs commit, zips, or safety-branch deletion until the required evidence is classified.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #161b22; stroke: #30363d; stroke-width: 2; rx: 18; }
      .greenPanel { fill: #112418; stroke: #3fb950; stroke-width: 3; rx: 18; }
      .amberPanel { fill: #2b2111; stroke: #d29922; stroke-width: 3; rx: 18; }
      .redPanel { fill: #261b1b; stroke: #f85149; stroke-width: 2; rx: 18; }
      .bluePanel { fill: #101d2b; stroke: #58a6ff; stroke-width: 2; rx: 18; }
      .title { fill: #f0f6fc; font: 700 36px system-ui, -apple-system, Segoe UI, sans-serif; }
      .subtitle { fill: #8b949e; font: 500 18px system-ui, -apple-system, Segoe UI, sans-serif; }
      .heading { fill: #f0f6fc; font: 700 24px system-ui, -apple-system, Segoe UI, sans-serif; }
      .body { fill: #c9d1d9; font: 500 17px system-ui, -apple-system, Segoe UI, sans-serif; }
      .muted { fill: #8b949e; font: 500 15px system-ui, -apple-system, Segoe UI, sans-serif; }
      .green { fill: #3fb950; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .yellow { fill: #d29922; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .red { fill: #f85149; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .blue { fill: #58a6ff; font: 700 16px system-ui, -apple-system, Segoe UI, sans-serif; }
      .mono { fill: #c9d1d9; font: 600 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .monoSmall { fill: #c9d1d9; font: 600 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .line { stroke: #30363d; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #8b949e; stroke-width: 2; stroke-dasharray: 8 8; fill: none; marker-end: url(#arrow); }
      .pillGreen { fill: #14301d; stroke: #3fb950; stroke-width: 1; rx: 12; }
      .pillAmber { fill: #332a16; stroke: #d29922; stroke-width: 1; rx: 12; }
      .pillRed { fill: #351b1b; stroke: #f85149; stroke-width: 1; rx: 12; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#30363d"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1680" height="1000"/>

  <text class="title" x="60" y="68">SyMoNeuRaL Phase 0 — Current Hold</text>
  <text class="subtitle" x="60" y="100">Snapshot: 2026-08-22 09:45 EDT · waiting for Block 1 repair output</text>

  <rect class="greenPanel" x="60" y="130" width="1560" height="130"/>
  <text class="heading" x="90" y="172">Already green</text>
  <text class="body" x="90" y="206">Gateway fold verification passed. A/B/C commit-output gate passed. Scope gate sections are closed records.</text>
  <text class="mono" x="90" y="236">Next evidence chain: repair output → Phase 0.5 re-measure tail → CLAUDE.md ladder update → 0.6 hygiene</text>
  <rect class="pillGreen" x="1370" y="156" width="185" height="38"/>
  <text class="green" x="1396" y="181">GATES CLOSED</text>

  <path class="line" d="M840 260 L840 300"/>

  <rect class="amberPanel" x="60" y="300" width="1560" height="155"/>
  <text class="heading" x="90" y="342">Current pending input: Block 1 repair output</text>
  <text class="body" x="90" y="377">Commit A message repair is approved. The final Block 1 uses show-ref guarded safety-branch handling.</text>
  <text class="mono" x="90" y="410">Expected: NEWA · C/B/A order · (?&lt;!Sub) restored · safety branch intact · residue unchanged</text>
  <rect class="pillAmber" x="1325" y="327" width="230" height="38"/>
  <text class="yellow" x="1350" y="352">PENDING BLOCK 1</text>

  <path class="dash" d="M840 455 L840 495"/>

  <rect class="bluePanel" x="60" y="495" width="740" height="260"/>
  <text class="heading" x="90" y="535">Classify Block 1 — repair</text>
  <text class="blue" x="90" y="568">GREEN ONLY IF ALL PRESENT</text>
  <text class="monoSmall" x="90" y="602">new A SHA printed as NEWA=&lt;sha&gt;</text>
  <text class="monoSmall" x="90" y="626">git log --oneline -3 still reads C, B, A</text>
  <text class="monoSmall" x="90" y="650">Commit A message tail includes (?&lt;!Sub)</text>
  <text class="monoSmall" x="90" y="674">safety branch phase0-before-message-repair exists</text>
  <text class="monoSmall" x="90" y="698">status residue unchanged</text>
  <text class="muted" x="90" y="730">If rebase stops: abort, checkout main, paste output. Do not run 0.5.</text>

  <rect class="bluePanel" x="880" y="495" width="740" height="260"/>
  <text class="heading" x="910" y="535">Classify Block 2 — Phase 0.5</text>
  <text class="blue" x="910" y="568">RUN ONLY AFTER BLOCK 1 GREEN</text>
  <text class="monoSmall" x="910" y="602">final HEAD SHA</text>
  <text class="monoSmall" x="910" y="626">backend apps pytest count</text>
  <text class="monoSmall" x="910" y="650">collect-only count</text>
  <text class="monoSmall" x="910" y="674">remix pytest count</text>
  <text class="monoSmall" x="910" y="698">real times printed</text>
  <text class="monoSmall" x="910" y="722">status residue unchanged</text>

  <path class="line" d="M840 755 L840 795"/>

  <rect class="panel" x="60" y="795" width="1560" height="92"/>
  <text class="heading" x="90" y="835">After 0.5 green</text>
  <text class="body" x="90" y="866">Stamp CLAUDE.md ladder with final SHA and counts. Then enter Phase 0.6 hygiene: move zips out, decide scope/docs commit, delete safety branch only there.</text>

  <rect class="redPanel" x="60" y="915" width="1560" height="52"/>
  <text class="red" x="90" y="948">HARD HOLD:</text>
  <text class="body" x="205" y="948">no deploy · no Phase 1 · no docs/specs commit · no zips · no safety-branch deletion until 0.6</text>
</svg>
