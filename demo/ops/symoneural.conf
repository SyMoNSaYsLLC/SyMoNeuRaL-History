<VirtualHost *:80>
   ServerName symoneural.com
   ServerAlias www.symoneural.com
   Redirect permanent / https://symoneural.com/
</VirtualHost>

<VirtualHost *:443>
   ServerName symoneural.com
   ServerAlias www.symoneural.com
   DocumentRoot /var/www/symoneural

   SSLEngine on
   SSLCertificateFile /etc/letsencrypt/live/symoneural.com-0001/fullchain.pem
   SSLCertificateKeyFile /etc/letsencrypt/live/symoneural.com-0001/privkey.pem

   <Directory /var/www/symoneural>
       Options Indexes FollowSymLinks
       AllowOverride All
       Require all granted
   </Directory>


   # ---- live playground API -------------------------------------------------
   # The inference engines bind 127.0.0.1 only; this is the sole route to them and
   # it is the only reason a visitor's request ever reaches the GPU. Turning the
   # playground off (demo/playground.sh off) leaves this stanza in place and simply
   # makes it return 503 -- static pages are unaffected either way.
   ProxyRequests Off
   ProxyPreserveHost On
   # An image render can legitimately take a while behind the queue; the API caps
   # jobs at 120s, so this sits just above it rather than racing it.
   ProxyTimeout 180
   <Location /api>
       # flushpackets=on matters: without it mod_proxy buffers the token stream and
       # the whole point of the chat demo -- watching tokens land as the card makes
       # them -- turns into one lump arriving at the end.
       ProxyPass        http://127.0.0.1:8800/api flushpackets=on
       ProxyPassReverse http://127.0.0.1:8800/api
   </Location>
   # Swagger UI and its schema. The UI's own JS/CSS are static files in the webroot and
   # are NOT proxied -- they are served straight off disk, which is both faster and the
   # reason the docs page makes no external request.
   <Location /docs>
       ProxyPass        http://127.0.0.1:8800/docs
       ProxyPassReverse http://127.0.0.1:8800/docs
   </Location>
   <Location /openapi.json>
       ProxyPass        http://127.0.0.1:8800/openapi.json
       ProxyPassReverse http://127.0.0.1:8800/openapi.json
   </Location>

   ErrorLog ${APACHE_LOG_DIR}/symoneural_error.log
   CustomLog ${APACHE_LOG_DIR}/symoneural_access.log combined
</VirtualHost>
